<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ludo King | Hidames</title>
  <link rel="stylesheet" href="ludo.css">
</head>
<body>
  <!-- Ambient Gold Glow -->
  <div class="ambient-glow"></div>

  <!-- Top Navigation Header -->
  <header class="ludo-header">
    <div class="header-left">
      <a href="exploregames.html" class="back-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
        <span>Games</span>
      </a>
    </div>
    <div class="header-center">
      <div class="logo">HID<span>AMES</span></div>
      <div class="game-tag">LUDO KING EDITION</div>
    </div>
    <div class="header-right">
      <button id="soundToggleBtn" class="icon-btn" title="Toggle Sound">🔊</button>
      <button id="restartBtn" class="icon-btn" title="Restart Game">🔄</button>
    </div>
  </header>

  <!-- Main Game Stage -->
  <main class="game-stage">
    
    <!-- Top Player Row -->
    <div class="players-row top-row">
      <!-- RED PLAYER POD (Top-Left) -->
      <div class="player-pod" id="pod-red" data-color="red">
        <div class="avatar-ring">
          <div class="avatar red-avatar">🔴</div>
          <div class="timer-ring"></div>
        </div>
        <div class="pod-info">
          <div class="player-name">Player 1</div>
          <div class="status-badge">WAITING</div>
        </div>
        <div class="dice-box" id="dice-red">
          <div class="dice">
            <div class="pip-grid pip-1"><span></span></div>
          </div>
          <span class="dice-cue">ROLL</span>
        </div>
      </div>

      <!-- Turn Notice Banner in between -->
      <div class="turn-banner" id="turnBanner">
        <span id="turnText">SELECT MODE TO START</span>
      </div>

      <!-- GREEN PLAYER POD (Top-Right) -->
      <div class="player-pod" id="pod-green" data-color="green">
        <div class="dice-box" id="dice-green">
          <div class="dice">
            <div class="pip-grid pip-1"><span></span></div>
          </div>
          <span class="dice-cue">ROLL</span>
        </div>
        <div class="pod-info text-right">
          <div class="player-name">Player 2</div>
          <div class="status-badge">WAITING</div>
        </div>
        <div class="avatar-ring">
          <div class="avatar green-avatar">🟢</div>
          <div class="timer-ring"></div>
        </div>
      </div>
    </div>

    <!-- Center 15x15 Ludo Board Container -->
    <div class="board-wrapper">
      <div class="ludo-board" id="ludoBoard">
        <!-- 15x15 grid cells injected dynamically via JavaScript -->
        
        <!-- Center Finish Area Trophy -->
        <div class="center-trophy">
          <div class="crown-icon">👑</div>
          <div class="center-brand">HID<span>AMES</span></div>
        </div>
      </div>
    </div>

    <!-- Bottom Player Row -->
    <div class="players-row bottom-row">
      <!-- BLUE PLAYER POD (Bottom-Left) -->
      <div class="player-pod" id="pod-blue" data-color="blue">
        <div class="avatar-ring">
          <div class="avatar blue-avatar">🔵</div>
          <div class="timer-ring"></div>
        </div>
        <div class="pod-info">
          <div class="player-name">Player 4</div>
          <div class="status-badge">WAITING</div>
        </div>
        <div class="dice-box" id="dice-blue">
          <div class="dice">
            <div class="pip-grid pip-1"><span></span></div>
          </div>
          <span class="dice-cue">ROLL</span>
        </div>
      </div>

      <!-- Live Notification Toast -->
      <div class="event-toast" id="eventToast"></div>

      <!-- YELLOW PLAYER POD (Bottom-Right) -->
      <div class="player-pod" id="pod-yellow" data-color="yellow">
        <div class="dice-box" id="dice-yellow">
          <div class="dice">
            <div class="pip-grid pip-1"><span></span></div>
          </div>
          <span class="dice-cue">ROLL</span>
        </div>
        <div class="pod-info text-right">
          <div class="player-name">Player 3</div>
          <div class="status-badge">WAITING</div>
        </div>
        <div class="avatar-ring">
          <div class="avatar yellow-avatar">🟡</div>
          <div class="timer-ring"></div>
        </div>
      </div>
    </div>

  </main>

  <!-- Mode Selector Modal (Shown on Load) -->
  <div class="modal-overlay" id="modeModal">
    <div class="modal-card">
      <div class="modal-header">
        <div class="logo">HID<span>AMES</span></div>
        <h2>LUDO KING</h2>
        <p>Choose your game mode to begin</p>
      </div>
      <div class="mode-options">
        <button class="mode-btn" onclick="startLudoGame(2, false)">
          <div class="mode-icon">👥</div>
          <div class="mode-meta">
            <h3>2 Players (Pass & Play)</h3>
            <p>Red vs Yellow across the board</p>
          </div>
        </button>

        <button class="mode-btn highlighted" onclick="startLudoGame(4, false)">
          <div class="mode-icon">👨‍👩‍👧‍👦</div>
          <div class="mode-meta">
            <h3>4 Players (Classic)</h3>
            <p>Red, Green, Yellow, Blue battle</p>
          </div>
        </button>

        <button class="mode-btn" onclick="startLudoGame(2, true)">
          <div class="mode-icon">🤖</div>
          <div class="mode-meta">
            <h3>Vs Computer (AI)</h3>
            <p>Play as Red against the Hidames AI</p>
          </div>
        </button>
      </div>
    </div>
  </div>

  <!-- Winner Victory Modal -->
  <div class="modal-overlay hidden" id="winnerModal">
    <div class="modal-card victory-card">
      <div class="trophy-bounce">🏆</div>
      <h2 id="winnerText">VICTORY!</h2>
      <p id="winnerSub">Congratulations to the Champion</p>
      <button class="action-btn" onclick="location.reload()">PLAY AGAIN</button>
    </div>
  </div>

  <script src="ludo.js"></script>
</body>
</html>
